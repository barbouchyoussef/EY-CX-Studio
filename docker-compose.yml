services:

  metabase-db:
    image: postgres:16
    container_name: metabase-db

    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: change_me

    volumes:
      - v0_metabase_inspection:/var/lib/postgresql/data

    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase

    ports:
      - "3001:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: change_me
      MB_DB_HOST: metabase-db

      MB_EMBEDDING_SECRET_KEY: "${METABASE_EMBED_SECRET}"

    depends_on:
      - metabase-db

    restart: unless-stopped

volumes:
  v0_metabase_inspection:
    external: true